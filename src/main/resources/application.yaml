spring:
  application:
    name: slot-reel-game-classic-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
    - "classpath:gamemath/paytable.yml"
    - "classpath:gamemath/gameconfig.yml"
    - "classpath:gamemath/reel1.yml"
    - "classpath:gamemath/reel2.yml"
    - "classpath:gamemath/reel3.yml"

server:
  port: ${SERVER_PORT:9071}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_HOST:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] [%X{userId}] [%X{type}] [%X{role}] [%-5level][%logger{0}] - %msg%n"