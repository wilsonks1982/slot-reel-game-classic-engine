spring:
  application:
    name: slot-reel-game-classic-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: "classpath:gamemath/reel1.yml"

server:
  port: ${SERVER_PORT:9071}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_HOST:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}


paytable:
  bets-values: [1, 2, 3, 4, 5]
  denom-values: [1, 2, 5, 10, 20, 50, 100, 200, 500]
  default-bet-index: 0
  default-denom-index: 4
  bet-values:
    - [1, 2, 5, 10, 20, 50, 100, 200, 500]
    - [2, 4, 10, 20, 40, 100, 200, 400, 1000]
    - [3, 6, 15, 30, 60, 150, 300, 600, 1500]
    - [4, 8, 20, 40, 80, 200, 400, 800, 2000]
    - [5, 10, 25, 50, 100, 250, 500, 1000, 2500]

